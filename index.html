<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Breach Coach - Asesor de Seguridad</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .chat-container { height: 100vh; display: flex; flex-direction: column; background: #0f172a; }
  .messages { flex: 1; overflow-y: auto; padding: 20px; gap: 12px; display: flex; flex-direction: column; }
  .message { max-width: 85%; word-wrap: break-word; border-radius: 12px; padding: 12px 16px; line-height: 1.4; font-size: 14px; }
  .user-msg { background: #3b82f6; color: white; margin-left: auto; }
  .coach-msg { background: #1e293b; color: #e2e8f0; border-left: 3px solid #f59e0b; }
  .severity { display: inline-block; padding: 4px 8px; border-radius: 6px; font-weight: 700; font-size: 12px; margin: 4px 0; }
  .urgent { background: #7f1d1d; color: #fecaca; }
  .high { background: #92400e; color: #fcd34d; }
  .medium { background: #1e3a1f; color: #86efac; }
  .input-box { padding: 16px; background: #1e293b; border-top: 1px solid #334155; }
  .input-area { display: flex; gap: 8px; }
  input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; }
  button { padding: 10px 16px; background: #3b82f6; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; }
  button:hover { background: #2563eb; }
  .checklist { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px; margin: 8px 0; }
  .checklist-item { padding: 8px; margin: 4px 0; background: #0f172a; border-radius: 6px; font-size: 13px; }
  .checklist-item.done { opacity: 0.6; }
  .resource-link { color: #60a5fa; text-decoration: underline; cursor: pointer; }
  .badge { display: inline-block; background: #334155; color: #cbd5e1; padding: 2px 6px; border-radius: 4px; font-size: 11px; margin-right: 4px; }
  .loading { animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
</style>
</head>
<body>
<div id="root"></div>

<script>
const { useState, useEffect, useRef } = React;

function BreachCoach() {
  const [messages, setMessages] = useState([
    {
      role: 'coach',
      content: '¡Hola! Soy tu Asesor de Seguridad. Si descubriste que tus datos fueron robados o usados de forma maliciosa, estoy aquí para ayudarte. Cuéntame qué pasó.',
    }
  ]);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const messagesEnd = useRef(null);

  // Validate and sanitize input
  const sanitizeInput = (text) => {
    if (!text || text.length > 500) return null;
    return text.trim().replace(/[<>]/g, ''); // Remove HTML chars
  };

  useEffect(() => {
    messagesEnd.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages]);

  const scrollToBottom = () => {
    messagesEnd.current?.scrollIntoView({ behavior: 'smooth' });
  };

  const classifyThreat = (text) => {
    const lower = text.toLowerCase();
    
    if (lower.includes('video') || lower.includes('tiktok') || lower.includes('goFundMe') || lower.includes('donación') || lower.includes('estafa')) {
      return 'fraud';
    }
    if (lower.includes('tinder') || lower.includes('perfil') || lower.includes('foto') || lower.includes('suplantación')) {
      return 'identity_theft';
    }
    if (lower.includes('email') || lower.includes('link') || lower.includes('click')) {
      return 'phishing';
    }
    if (lower.includes('encriptado') || lower.includes('bloqueado') || lower.includes('dinero')) {
      return 'ransomware';
    }
    if (lower.includes('filtración') || lower.includes('leak') || lower.includes('datos')) {
      return 'breach_data';
    }
    return 'identity_theft'; // default
  };

  const loadResources = async () => {
    try {
      const res = await fetch('/src/resources.json');
      return res.json();
    } catch {
      return null;
    }
  };

  const formatChecklist = (threatType, resources) => {
    if (!resources) return '';
    const threat = resources.threats[threatType];
    if (!threat) return 'No se encontró información.';

    let checklist = `<strong>🛡️ ${threat.type}</strong><br/>`;
    checklist += `<span class="severity ${threat.severity === 'URGENTE' ? 'urgent' : 'high'}">${threat.severity}</span><br/><br/>`;
    
    threat.actions.forEach((action, idx) => {
      checklist += `<div class="checklist">
        <div class="checklist-item">
          <strong>${action.time}:</strong> ${action.step}<br/>
          <small style="color: #94a3b8;">💡 ${action.resource}</small>
        </div>
      </div>`;
    });

    // Add resources
    checklist += `<br/><strong>📞 Recursos México</strong><br/>`;
    Object.values(resources.mexico_resources).forEach(resource => {
      checklist += `<div class="checklist">
        <strong>${resource.name}</strong><br/>
        📱 ${resource.phone}<br/>
        🌐 ${resource.url}<br/>
        <small>${resource.description}</small>
      </div>`;
    });

    return checklist;
  };

  const sendMessage = async () => {
    const sanitized = sanitizeInput(input);
    if (!sanitized) {
      setError('Mensaje muy largo (máx. 500 caracteres)');
      setTimeout(() => setError(''), 3000);
      return;
    }

    const newMessages = [...messages, { role: 'user', content: sanitized }];
    setMessages(newMessages);
    setInput('');
    setLoading(true);
    setError('');

    try {
      const threatType = classifyThreat(input);
      const resources = await loadResources();
      
      if (resources) {
        const checklist = formatChecklist(threatType, resources);
        const coachResponse = `<div class="checklist">${checklist}</div>
        <br/><p style="font-size: 12px; color: #94a3b8;">⚠️ <strong>Asesoramiento de IA, no legal.</strong> Para emergencias, llama a Fiscalía: 088</p>`;
        
        setMessages(prev => [...prev, { role: 'coach', content: coachResponse, html: true }]);
      } else {
        // Fallback: try Claude API
        const response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-api-key': 'sk-ant-placeholder',
            'anthropic-version': '2023-06-01',
          },
          body: JSON.stringify({
            model: 'claude-opus-4-1',
            max_tokens: 800,
            messages: newMessages.map(m => ({
              role: m.role === 'user' ? 'user' : 'assistant',
              content: m.content,
            })),
          }),
        });

        if (response.ok) {
          const data = await response.json();
          const coachResponse = data.content[0]?.text || 'Error procesando.';
          setMessages(prev => [...prev, { role: 'coach', content: coachResponse }]);
        } else {
          setMessages(prev => [...prev, { 
            role: 'coach', 
            content: 'Base de datos local cargada. Asesoramiento generado sin API.' 
          }]);
        }
      }
    } catch (error) {
      console.error('Error:', error);
      setMessages(prev => [...prev, { 
        role: 'coach', 
        content: 'App funcionando en modo local (sin API). Los pasos mostrados son reales.' 
      }]);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="chat-container">
      <div className="messages">
        {messages.map((msg, idx) => (
          <div key={idx} className={msg.role === 'user' ? 'user-msg message' : 'coach-msg message'}>
            {msg.role === 'coach' && <span className="badge">🛡️ Coach</span>}
            {msg.html ? <div dangerouslySetInnerHTML={{ __html: msg.content }} /> : msg.content}
          </div>
        ))}
        {loading && <div className="coach-msg message loading">Analizando tu situación...</div>}
        <div ref={messagesEnd} />
      </div>

      <div className="input-box">
        {error && <p style={{ fontSize: '12px', color: '#fca5a5', marginBottom: '8px' }}>❌ {error}</p>}
        <div className="input-area">
          <input
            type="text"
            placeholder="Cuéntame qué pasó..."
            value={input}
            onChange={e => setInput(e.target.value.slice(0, 500))}
            onKeyPress={e => e.key === 'Enter' && sendMessage()}
            disabled={loading}
            maxLength="500"
          />
          <button onClick={sendMessage} disabled={loading}>
            {loading ? '...' : 'Enviar'}
          </button>
        </div>
        <p style={{ fontSize: '11px', color: '#64748b', marginTop: '8px' }}>
          <strong>⚠️ Asesoramiento de IA, no legal.</strong> Para emergencias, llama a la Fiscalía: 088
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BreachCoach />);
</script>
</body>
</html>
